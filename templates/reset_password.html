{% extends "base.html" %}

{% block title %}Saisie du Code SMS & Nouveau Mot de Passe - Fromagerie Les Tepuys{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-header text-white text-center py-3" style="background-color: var(--header-bg);">
                <h3 class="mb-0 fw-bold"><i class="bi bi-shield-check text-warning me-2"></i>Validation Code SMS</h3>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info py-2 small mb-3">
                    <i class="bi bi-info-circle-fill me-1"></i>Un code SMS à 4 chiffres a été envoyé au numéro <strong>{{ reset_phone }}</strong>.
                </div>

                <form method="POST" action="{{ url_for('reset_password') }}">
                    <div class="mb-3">
                        <label for="sms_code" class="form-label fw-bold">Code SMS à 4 chiffres</label>
                        <input type="text" class="form-control form-control-lg text-center fw-bold letter-spacing-2" id="sms_code" name="sms_code" maxlength="4" placeholder="1234" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-bold">Nouveau mot de passe</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required placeholder="Saisissez votre nouveau mot de passe">
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-bold">Confirmer le nouveau mot de passe</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Confirmez le mot de passe">
                    </div>

                    <div class="mt-4 d-grid">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">
                            <i class="bi bi-check-circle-fill me-2"></i>Valider & Changer le mot de passe
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-secondary small fw-bold">Renvoyer un nouveau code</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
